name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Check Node
        run: node -v

      - name: Check PHP
        run: php -v

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
      
      - name: Install dependencies
        run: npm install

      - name: Run JS tests
        run: npm test
